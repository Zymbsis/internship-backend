name: internship-backend

services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  api-dev:
    profiles: [dev]
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/.venv
    command:
      - uv
      - run
      - fastapi
      - dev
      - app/main.py
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
