[project]
name = "internship-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv","migrations", "alembic"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["B905", "D100", "D101", "D102", "D103", "D104", "D107", "COM812", "FAST001", "TRY003", "EM101", "FBT001", "FBT002", "TRY301", "D203", "D213", "PLR0913", "DTZ007"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**/*.py" = ["S101", "TCH001", "TCH002"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "app.config"
disable_error_code = ["call-arg"]
